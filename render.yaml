databases:
  - name: kahe-tms-db
    databaseName: tms_db
    user: bebin

services:
  - type: web
    name: kahe-tms
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: uploaded-media
      mountPath: /app/backend/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kahe-tms-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: tms_project.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: kahe-tms.onrender.com,localhost,127.0.0.1
      - key: MEDIA_ROOT
        value: /app/backend/media
      - key: DATABASE_SSL
        value: "True"
      - key: SECRET_KEY
        generateValue: true
