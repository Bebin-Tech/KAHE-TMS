services:
  - type: web
    name: kahe-tms
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    disk:
      name: kahe-tms-data
      mountPath: /app/backend/persistent
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tms_project.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: kahe-tms.onrender.com,localhost,127.0.0.1
      - key: SQLITE_PATH
        value: /app/backend/persistent/db.sqlite3
      - key: MEDIA_ROOT
        value: /app/backend/persistent/media
      - key: SECRET_KEY
        generateValue: true
